<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lil todo list</title>
  <meta name="description" content="A tiny pixel-art todo journal, kept by a very cool bunny.">
  <meta name="theme-color" content="#1d1a26">
  <meta property="og:title" content="lil todo list">
  <meta property="og:description" content="A tiny pixel-art todo journal, kept by a very cool bunny.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <button type="button" class="theme-toggle icon-btn" id="theme-toggle">
      <i data-sprite="sun" data-scale="2" class="show-dark"></i>
      <i data-sprite="moon" data-scale="2" class="show-light"></i>
    </button>

    <header class="hero">
      <i data-sprite="vine" data-scale="2" class="crest" aria-hidden="true"></i>
      <h1>lil todo list</h1>
      <p class="date" id="date"></p>
    </header>

    <!-- the closed books, side by side -->
    <section class="shelf-view" id="shelf-view" aria-label="Your books" hidden>
      <div class="carousel" id="carousel"></div>
      <div class="shelf-tools">
        <button type="button" class="nudge" id="book-prev" aria-label="Previous book">&lt;</button>
        <div class="swatches" id="swatches" role="group" aria-label="Cover colour"></div>
        <button type="button" id="del-book" class="icon-btn" aria-label="Delete this book" title="delete book">
          <i data-sprite="trashLight" data-scale="2"></i>
        </button>
        <button type="button" class="nudge" id="book-next" aria-label="Next book">&gt;</button>
      </div>
    </section>

    <!-- one open book -->
    <div class="book" id="book">
      <div class="book-bar">
        <button type="button" class="book-close" id="close-book" title="back to your books (esc)">
          <span aria-hidden="true">&lt;</span> <span id="book-title"></span>
        </button>
      </div>

      <div class="deck" id="deck">
        <section class="page" id="card" aria-label="Current list">
          <div class="peek" aria-hidden="true">
            <p class="bubble px" id="bubble">yo.</p>
            <i data-sprite="bunny" data-scale="4" class="peek-bunny" id="peek-bunny"></i>
          </div>

          <!-- every row below shares one grid: [icon] [text] [buttons] -->
          <div class="row head">
            <label for="list-name" class="sr-only">List name</label>
            <input id="list-name" class="list-name" maxlength="24" spellcheck="false">
            <button type="button" id="del-list" class="icon-btn" aria-label="Delete this list" title="delete list">
              <i data-sprite="trash" data-scale="2"></i>
            </button>
          </div>

          <form id="new" class="row add" autocomplete="off">
            <button class="add-btn" type="submit" aria-label="Add task" title="add task">
              <i data-sprite="plusPaper" data-scale="2"></i>
            </button>
            <label for="new-text" class="sr-only">New task</label>
            <input id="new-text" class="line-field" placeholder="new task" maxlength="140" required>
            <button class="icon-btn" type="submit" data-as="title" aria-label="Add as a section title" title="add as a section title">
              <i data-sprite="mark" data-scale="2"></i>
            </button>
          </form>

          <ul id="list" class="list"></ul>

          <div id="empty" class="empty" hidden>
            <i data-sprite="bunnySleep" data-scale="4"></i>
            <p id="empty-text">blank page...</p>
          </div>

          <footer class="row foot" aria-live="polite">
            <i data-sprite="box" data-scale="2" class="lead-icon" aria-hidden="true"></i>
            <span class="tally">
              <span title="left to do"><span id="count"></span><span class="sr-only"> left</span></span>
              <button type="button" id="show-done" class="done-toggle" aria-expanded="false" aria-controls="done-panel" title="show finished" hidden>
                <i data-sprite="check" data-scale="2"></i>
                <span id="done-count"></span><span class="sr-only"> done</span>
              </button>
            </span>
            <button type="button" id="clear-done" class="icon-btn" aria-label="Clear all finished" title="clear finished" hidden>
              <i data-sprite="trash" data-scale="2"></i>
            </button>
          </footer>

          <div id="done-panel" class="done-panel" hidden>
            <ul id="done-list" class="list done-list"></ul>
            <p id="done-older" class="done-older" hidden></p>
          </div>
        </section>
      </div>

      <nav class="lists-nav" aria-label="Your lists">
        <div class="tabs" id="tabs"></div>
      </nav>
    </div>
  </main>

  <div class="toast px" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" class="icon-btn" id="undo" aria-label="Undo" title="undo">
      <i data-sprite="revertGold" data-scale="2"></i>
    </button>
  </div>
</body>
</html>
